<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA · Abriendo asistente de Ollama</title>
  <meta name="robots" content="noindex" />
  <script>
    (() => {
      const current = new URL(window.location.href);
      const target = new URL('/', window.location.origin);
      target.searchParams.set('view', 'ollama-setup');
      target.searchParams.set('return', current.searchParams.get('return') || '/');
      target.searchParams.set('source', current.searchParams.get('source') || 'legacy-redirect');
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <p>Abriendo el asistente integrado de AURA…</p>
  <noscript>
    <p>JavaScript es necesario. <a href="/?view=ollama-setup&amp;return=/">Abrir asistente de Ollama</a>.</p>
  </noscript>
</body>
</html>
