<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casabero | Technical Data Auditor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;700&family=Outfit:wght@500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --main-color: #111111;
      --secondary-color: #666666;
      --bg-color: #FFFFFF;
      --technical-bg: #F3F4F6;
      --border-color: #E5E7EB;
      --accent-focus: #000000;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--main-color);
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    .font-display {
      font-family: 'Outfit', sans-serif;
    }

    .font-mono {
      font-family: 'Fira Code', monospace;
    }

    /* Glitch Animation */
    .glitch-hover:hover {
      animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
    }

    @keyframes glitch {
      0% {
        transform: translate(0)
      }

      20% {
        transform: translate(-2px, 2px)
      }

      40% {
        transform: translate(-2px, -2px)
      }

      60% {
        transform: translate(2px, 2px)
      }

      80% {
        transform: translate(2px, -2px)
      }

      100% {
        transform: translate(0)
      }
    }

    /* Blueprint Mode (Easter Egg) */
    .blueprint-mode {
      --bg-color: #003366;
      --main-color: #FFFFFF;
      --secondary-color: #AACCFF;
      --technical-bg: rgba(255, 255, 255, 0.1);
      --border-color: rgba(255, 255, 255, 0.3);
    }

    .blueprint-mode * {
      font-family: 'Fira Code', monospace !important;
    }

    .blueprint-mode::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
      z-index: 100;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: var(--technical-bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--secondary-color);
      opacity: 0.5;
    }
  </style>
