name: AURA CI

# main recibe los cambios y es la rama que publica Coolify.
# CI verifica tipos, tests, invariantes del pipeline y compilación.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './src/package-lock.json'

      # Los tests de remediación ejecutan el runner real (Python + pandas).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: './experiments/runners/requirements.txt'

      - name: Install runner dependencies
        run: pip install -r ../experiments/runners/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Pipeline invariants
        run: npx vitest run __tests__/invariants

      - name: Unit and contract tests
        run: npx vitest run

      - name: Build
        run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './api/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: set -o pipefail; npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-v2-5-c-typecheck
          path: ./src/typecheck.log
          if-no-files-found: error

      - name: Diagnosis V2.5-C focused tests
        run: set -o pipefail; npm test -- diagnosisEvidenceIdentityV1.test.ts diagnosisV2_5Projection.test.ts diagnosisV2_5Trace.test.ts diagnosisV2_5Comparison.test.ts formalDiagnosisV2_5.test.ts 2>&1 | tee diagnosis-v2-5-c-tests.log

      - name: Upload focused test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-v2-5-c-tests
          path: ./src/diagnosis-v2-5-c-tests.log
          if-no-files-found: error

      - name: Verify Diagnosis V2.5-C structural comparison
        run: npm run diagnosis:v2.5-comparison -- --check ../docs/product/aura/evidence/diagnosis-v2.5/diagnosis-v2-5-c-comparison.json --output ./diagnosis-v2-5-c-comparison.json

      - name: Upload Diagnosis V2.5-C comparison
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-v2-5-c-comparison
          path: ./src/diagnosis-v2-5-c-comparison.json
          if-no-files-found: error

      - name: Diagnosis regression tests
        run: set -o pipefail; npm test -- diagnosis --exclude __tests__/controlledDatasetDiagnosisInputs.test.ts --exclude __tests__/formalDiagnosisEvaluator.test.ts 2>&1 | tee diagnosis-regression-tests.log

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-regression-tests
          path: ./src/diagnosis-regression-tests.log
          if-no-files-found: error

      - name: Build
        run: npm run build --if-present

      - name: Tests
        run: npm test --if-present
