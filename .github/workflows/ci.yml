name: AURA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './src/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: set -o pipefail; npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-v2-5-c-typecheck
          path: ./src/typecheck.log
          if-no-files-found: error

      - name: Diagnosis V2.5-C focused tests
        run: set -o pipefail; npm test -- diagnosisEvidenceIdentityV1.test.ts diagnosisV2_5Projection.test.ts formalDiagnosisV2_5.test.ts 2>&1 | tee diagnosis-v2-5-c-tests.log

      - name: Upload focused test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-v2-5-c-tests
          path: ./src/diagnosis-v2-5-c-tests.log
          if-no-files-found: error

      - name: Diagnosis regression tests
        run: set -o pipefail; npm test -- diagnosis 2>&1 | tee diagnosis-regression-tests.log

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-regression-tests
          path: ./src/diagnosis-regression-tests.log
          if-no-files-found: error

      - name: Build
        run: npm run build
