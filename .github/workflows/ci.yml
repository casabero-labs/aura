name: AURA CI

# main recibe commits; production solo avanza cuando todo lo de abajo pasa.
# Coolify despliega desde production, así que un cambio que rompa tipos,
# tests, invariantes del pipeline o build nunca llega a aura.casabero.com.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './src/package-lock.json'

      # Los tests de remediación ejecutan el runner real (Python + pandas).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: './experiments/runners/requirements.txt'

      - name: Install runner dependencies
        run: pip install -r ../experiments/runners/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Pipeline invariants
        run: npx vitest run __tests__/invariants

      - name: Unit and contract tests
        run: npx vitest run

      - name: Build
        run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './api/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Tests
        run: npm test --if-present

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, api]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward production to the verified commit
        run: git push origin "${GITHUB_SHA}:refs/heads/production"
