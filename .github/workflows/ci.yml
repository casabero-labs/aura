name: AURA CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - '*.json'
      - '*.yml'
      - '*.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - '*.json'
      - '*.yml'
      - '*.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './src/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
