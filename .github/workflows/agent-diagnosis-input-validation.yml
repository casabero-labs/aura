# Temporary branch-only validation. Removed after checks complete.
name: Agent diagnosis input validation

on:
  push:
    branches:
      - agent/unify-diagnosis-input-builders
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Full unit suite
        id: tests
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile=vitest-results.json
      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-input-vitest-results
          path: src/vitest-results.json
          if-no-files-found: error
      - name: Fail when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Build
        run: npm run build
